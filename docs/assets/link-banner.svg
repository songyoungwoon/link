<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">LINK — Linked Interactive Network</title>
  <desc id="description">Every World. One Link. A network of geometric worlds connects LINK Protocol, LINK Browser, and the Element, Script, Style world standards.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07161c"/>
      <stop offset="1" stop-color="#112b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9af5d2"/>
      <stop offset="1" stop-color="#55cfe1"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#42b9b0" stop-opacity=".2"/>
      <stop offset="1" stop-color="#42b9b0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ec9c6" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="518" rx="24" fill="url(#background)" stroke="#29464c"/>
  <rect x="24" y="24" width="1152" height="472" rx="14" fill="url(#grid)"/>
  <ellipse cx="938" cy="205" rx="280" ry="210" fill="url(#glow)"/>

