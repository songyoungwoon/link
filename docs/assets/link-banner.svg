    <text x="1138" y="66" text-anchor="end" fill="#79a2aa" font-size="11" letter-spacing="1.7">NATIVE PROTOTYPE · v0.1</text>

    <text x="54" y="207" fill="#f1fbf8" font-size="128" font-weight="700" letter-spacing="-7">LINK</text>
    <text x="61" y="267" fill="#9af5d2" font-size="30" font-weight="600" letter-spacing="-.5">Every World. One Link.</text>
    <text x="62" y="309" fill="#a8c2c5" font-size="19">An open standard for connected virtual worlds.</text>

